[project]
name = "binance-orderbook"
version = "0.1.0"
description = "A high-performance real-time orderbook library for Binance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0,<14.0",
    "aiohttp>=3.9",
    "sortedcontainers>=2.4",
    "pyarrow>=15.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orderbook"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]